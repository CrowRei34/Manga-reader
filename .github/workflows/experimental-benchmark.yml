name: Medir optimizaciones experimental

on:
  push:
    branches:
      - experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-benchmark
  cancel-in-progress: true

jobs:
  baseline:
    name: Medir paquete portátil
    if: github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev \
            libgl1-mesa-dev pkg-config

      - name: Construir daemon Java
        working-directory: daemon
        run: ./gradlew test shadowJar --no-daemon

      - name: Construir binarios Rust
        run: cargo build --release --locked

      - name: Empaquetar runtime completo
        env:
          SKIP_BUILD: "1"
          JRE_HOME: ${{ env.JAVA_HOME }}
          CPACK_BUILD_DIR: build/cpack-full
          CPACK_DIST_DIR: dist-full
        run: ./package_cpack.sh 0.0.0-experimental

      - name: Medir runtime completo
        env:
          JRE_HOME: ${{ env.JAVA_HOME }}
          PACKAGE_PATH: dist-full/Bakeneko-Portable-v0.0.0-experimental-Linux-x86_64.tar.gz
          REPORT_PATH: benchmark-full.txt
        run: scripts/measure-build.sh

      - name: Empaquetar runtime jlink
        env:
          SKIP_BUILD: "1"
          BAKENEKO_JLINK: "1"
          JRE_HOME: ${{ env.JAVA_HOME }}
          CPACK_BUILD_DIR: build/cpack-jlink
          CPACK_DIST_DIR: dist-jlink
        run: ./package_cpack.sh 0.0.0-experimental

      - name: Medir runtime jlink
        env:
          JRE_HOME: build/cpack-jlink/jre-jlink
          PACKAGE_PATH: dist-jlink/Bakeneko-Portable-v0.0.0-experimental-Linux-x86_64.tar.gz
          REPORT_PATH: benchmark-jlink.txt
        run: scripts/measure-build.sh

      - name: Validar ambos paquetes
        run: |
          set -euo pipefail
          for variant in full jlink; do
            package="dist-${variant}/Bakeneko-Portable-v0.0.0-experimental-Linux-x86_64.tar.gz"
            test -s "$package"
            check_dir="$(mktemp -d)"
            tar -xzf "$package" -C "$check_dir"
            # No depender del formato exacto que use tar para listar la
            # carpeta raíz (con o sin ./): localizamos el runtime extraído.
            # `bin/java` puede ser un archivo regular o un enlace simbólico
            # según la distribución de Java usada por setup-java.
            java_path="$(find "$check_dir" -path '*/app/jre/bin/java' -print -quit)"
            test -n "$java_path"
            root="${java_path%/app/jre/bin/java}"
            test -x "$root/app/jre/bin/java"
            test -x "$root/app/jre/bin/keytool"
            test -s "$root/app/jre/lib/security/cacerts"
            echo "[$variant] runtime encontrado en $root"
            "$root/app/jre/bin/java" -version
          done

      - name: Diagnosticar runtimes extraídos
        if: always()
        run: |
          set +e
          : > validation-diagnostics.txt
          for variant in full jlink; do
            package="dist-${variant}/Bakeneko-Portable-v0.0.0-experimental-Linux-x86_64.tar.gz"
            {
              echo "===== $variant ====="
              echo "package: $package"
              echo "archive entries:"
              tar -tzf "$package" 2>&1 | grep -E 'app/jre/(bin/(java|keytool)|lib/security/cacerts)(/)?$' || true
              check_dir="$(mktemp -d)"
              tar -xzf "$package" -C "$check_dir" || true
              echo "java candidates:"
              find "$check_dir" -path '*/app/jre/bin/java' -print -exec ls -ld {} \; 2>&1
              echo "runtime files:"
              find "$check_dir" \( -path '*/app/jre/bin/keytool' -o -path '*/app/jre/lib/security/cacerts' \) -print -exec ls -ld {} \; 2>&1
              java_path="$(find "$check_dir" -path '*/app/jre/bin/java' -print -quit)"
              if [ -n "$java_path" ]; then
                root="${java_path%/app/jre/bin/java}"
                echo "root: $root"
                file "$root/app/jre/bin/java" "$root/app/jre/bin/keytool" "$root/app/jre/lib/security/cacerts" 2>&1
                ls -l "$root/app/jre/bin/java" "$root/app/jre/bin/keytool" "$root/app/jre/lib/security/cacerts" 2>&1
                "$root/app/jre/bin/java" -version 2>&1
              fi
            } >> validation-diagnostics.txt
          done

      - name: Unir reportes
        if: always()
        run: |
          {
            cat benchmark-full.txt 2>/dev/null || true
            echo
            echo "===== jlink ====="
            cat benchmark-jlink.txt 2>/dev/null || true
            echo
            echo "===== validation diagnostics ====="
            cat validation-diagnostics.txt 2>/dev/null || true
          } > experimental-benchmark.txt

      - name: Exponer diagnóstico en el check
        if: always()
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # GitHub muestra estas líneas en las anotaciones del job, incluso
            # cuando el paso de validación terminó con error.
            printf '::notice file=.github/workflows/experimental-benchmark.yml,line=1::%s\n' "$line"
          done < validation-diagnostics.txt

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-benchmark-${{ github.sha }}
          path: |
            experimental-benchmark.txt
            benchmark-full.txt
            benchmark-jlink.txt
            validation-diagnostics.txt
          if-no-files-found: error
