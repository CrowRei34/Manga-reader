name: Publicar paquete portátil

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la letra v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: Compilar y publicar tar.gz x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev \
            libgl1-mesa-dev pkg-config

      - name: Construir el daemon
        working-directory: daemon
        run: ./gradlew test shadowJar --no-daemon

      - name: Probar la aplicación
        run: cargo test --workspace --lib --locked

      - name: Construir binario optimizado
        run: cargo build --release --locked

      - name: Resolver versión
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Construir paquete portátil CPack
        env:
          SKIP_BUILD: "1"
        run: ./package_cpack.sh "${{ steps.version.outputs.value }}"

      - name: Validar Java dentro del paquete
        run: |
          ./scripts/validate-portable-package.sh \
            "dist/Bakeneko-Portable-v${{ steps.version.outputs.value }}-Linux-x86_64.tar.gz"

      - name: Preparar raíz de la imagen cpak
        run: ./scripts/prepare-cpak-root.sh "${{ steps.version.outputs.value }}"

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publicar imagen OCI cpak
        id: cpak_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          build-args: |
            BAKENEKO_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/crowrei34/manga-reader:v${{ steps.version.outputs.value }}
            ghcr.io/crowrei34/manga-reader:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Instalar cpak para validar el manifiesto
        env:
          CPAK_VERSION: "2.13.3"
          CPAK_SHA256: "1c842ae9eeccb071d948e2bf0360453f6b39edf011b585f3d0c4a77548c84b98"
          CPAK_STORAGED_SHA256: "cc5ddf5fba5cbc9612b50cdb5fb9d5cfded3cd5d13297f1e8602b874f944aa40"
        run: |
          mkdir -p "$RUNNER_TEMP/cpak-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/Containerpak/cpak/releases/download/v${CPAK_VERSION}/cpak-linux-amd64" \
            --output "$RUNNER_TEMP/cpak-bin/cpak"
          echo "${CPAK_SHA256}  $RUNNER_TEMP/cpak-bin/cpak" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/cpak-bin/cpak"
          curl --fail --location --silent --show-error \
            "https://github.com/Containerpak/cpak/releases/download/v${CPAK_VERSION}/cpak-storaged-linux-amd64" \
            --output "$RUNNER_TEMP/cpak-bin/cpak-storaged"
          echo "${CPAK_STORAGED_SHA256}  $RUNNER_TEMP/cpak-bin/cpak-storaged" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/cpak-bin/cpak-storaged"
          echo "$RUNNER_TEMP/cpak-bin" >> "$GITHUB_PATH"

      - name: Generar y validar manifest cpak
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_DIGEST: ${{ steps.cpak_image.outputs.digest }}
        run: |
          ./scripts/write-cpak-manifest.sh \
            "$VERSION" \
            "ghcr.io/crowrei34/manga-reader@${IMAGE_DIGEST}"
          cpak validate cpak.json
          cpak lock cpak.json
          cpak test cpak.json

      - name: Publicar manifest cpak en main
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpak.json cpak.lock
          git commit -m "build: publish cpak manifest v$VERSION"
          git push origin HEAD:main

      - name: Generar suma SHA-256
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="Bakeneko-Portable-v${VERSION}-Linux-x86_64.tar.gz"
          cp "dist/${PACKAGE}.sha256" SHA256SUMS

      - name: Publicar procedencia verificable
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/Bakeneko-Portable-v${{ steps.version.outputs.value }}-Linux-x86_64.tar.gz"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            for legacy_asset in \
              Bakeneko-Portable-Linux-x86_64.tar.gz \
              Bakeneko-Portable-Linux-x86_64.tar.gz.sha256; do
              gh release delete-asset "v$VERSION" "$legacy_asset" --yes 2>/dev/null || true
            done
            gh release upload "v$VERSION" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz.sha256" \
              SHA256SUMS --clobber
          else
            gh release create "v$VERSION" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz.sha256" \
              SHA256SUMS \
              --title "Bakeneko v$VERSION" \
              --generate-notes
          fi
