name: Publicar paquete portátil

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la letra v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: Compilar y publicar tar.gz x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev \
            libgl1-mesa-dev pkg-config

      - name: Construir el daemon
        working-directory: daemon
        run: ./gradlew test shadowJar --no-daemon

      - name: Probar la aplicación
        run: cargo test --workspace --all-targets --locked

      - name: Construir binarios optimizados
        run: cargo build --release --locked --package bakeneko --package bakeneko-solver

      - name: Resolver versión
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Construir paquete portátil CPack
        env:
          SKIP_BUILD: "1"
        run: ./package_cpack.sh "${{ steps.version.outputs.value }}"

      - name: Validar ejecutables dentro del paquete
        run: |
          PACKAGE="dist/Bakeneko-Portable-v${{ steps.version.outputs.value }}-Linux-x86_64.tar.gz"
          tar -tzf "$PACKAGE" | grep '/app/jre/bin/java$' >/dev/null
          tar -tzf "$PACKAGE" | grep '/app/bakeneko-solver$' >/dev/null
          CHECK_DIR="$(mktemp -d)"
          tar -xzf "$PACKAGE" -C "$CHECK_DIR"
          ROOT="$(find "$CHECK_DIR" -mindepth 1 -maxdepth 1 -type d -name 'Bakeneko-Portable-*' -print -quit)"
          test -x "$ROOT/app/bakeneko"
          test -x "$ROOT/app/bakeneko-solver"
          test -x "$ROOT/app/jre/bin/java"
          "$ROOT/app/bakeneko-solver" --version
          ! ldd "$ROOT/app/bakeneko-solver" | grep -q 'not found'

      - name: Generar suma SHA-256
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PACKAGE="Bakeneko-Portable-v${VERSION}-Linux-x86_64.tar.gz"
          STABLE="Bakeneko-Portable-Linux-x86_64.tar.gz"
          cp "dist/${PACKAGE}" "dist/${STABLE}"
          sed "s/${PACKAGE}/${STABLE}/" "dist/${PACKAGE}.sha256" > "dist/${STABLE}.sha256"
          cp "dist/${PACKAGE}.sha256" SHA256SUMS

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-Linux-x86_64.tar.gz.sha256" \
              SHA256SUMS --clobber
          else
            gh release create "v$VERSION" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-Linux-x86_64.tar.gz" \
              "dist/Bakeneko-Portable-Linux-x86_64.tar.gz.sha256" \
              SHA256SUMS \
              --title "Bakeneko v$VERSION" \
              --generate-notes
          fi
