name: Publicar AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la letra v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Compilar y publicar AppImage x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev \
            libgl1-mesa-dev pkg-config

      - name: Construir el daemon
        working-directory: daemon
        run: ./gradlew test shadowJar --no-daemon

      - name: Probar la aplicación
        run: cargo test --workspace --lib --locked

      - name: Resolver versión
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Construir AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./make_universal.sh "${{ steps.version.outputs.value }}"

      - name: Construir paquete portátil CPack
        env:
          SKIP_BUILD: "1"
          JRE_HOME: ${{ env.JAVA_HOME }}
        run: ./package_cpack.sh "${{ steps.version.outputs.value }}"

      - name: Generar suma SHA-256
        run: |
          sha256sum "Bakeneko-Universal-v${{ steps.version.outputs.value }}.AppImage" > SHA256SUMS
          cat "dist/Bakeneko-Portable-v${{ steps.version.outputs.value }}-Linux-x86_64.tar.gz.sha256" >> SHA256SUMS

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" \
              "Bakeneko-Universal-v$VERSION.AppImage" \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              SHA256SUMS --clobber
          else
            gh release create "v$VERSION" \
              "Bakeneko-Universal-v$VERSION.AppImage" SHA256SUMS \
              "dist/Bakeneko-Portable-v$VERSION-Linux-x86_64.tar.gz" \
              --title "Bakeneko v$VERSION" \
              --generate-notes
          fi
