[package]
name = "bakeneko-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs", "net", "sync", "time", "macros", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
iced = { version = "0.13", features = ["image"] }

[dev-dependencies]
temp-env = "0.3"

